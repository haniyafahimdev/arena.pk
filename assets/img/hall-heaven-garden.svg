<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="gardenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12261a"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <radialGradient id="gardenGlow" cx="50%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#4fae3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4fae3b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="375" fill="url(#gardenBg)"/>
  <rect width="600" height="375" fill="url(#gardenGlow)"/>
  <!-- string lights arc -->
  <path d="M-20,40 Q300,-40 620,40" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
  <g fill="#f5a623" opacity="0.9">
    <circle cx="20" cy="34" r="3"/><circle cx="90" cy="10" r="3"/><circle cx="170" cy="-4" r="3"/>
    <circle cx="260" cy="-10" r="3"/><circle cx="340" cy="-8" r="3"/><circle cx="420" cy="2" r="3"/>
    <circle cx="500" cy="18" r="3"/><circle cx="570" cy="36" r="3"/>
  </g>
  <!-- foliage silhouettes framing -->
  <g fill="#0e2416">
    <ellipse cx="40" cy="330" rx="120" ry="90"/>
    <ellipse cx="560" cy="330" rx="130" ry="95"/>
    <ellipse cx="120" cy="290" rx="60" ry="50"/>
    <ellipse cx="480" cy="290" rx="70" ry="55"/>
  </g>
  <g fill="#173a24">
    <ellipse cx="60" cy="345" rx="80" ry="55"/>
    <ellipse cx="540" cy="345" rx="90" ry="58"/>
  </g>
  <!-- lawn -->
  <rect x="0" y="310" width="600" height="65" fill="#0c1f14"/>
  <!-- long tables, side view suggestion -->
  <g opacity="0.85">
    <rect x="150" y="255" width="140" height="8" rx="3" fill="#1c3a26" stroke="#4fae3b" stroke-width="1"/>
    <rect x="330" y="240" width="140" height="8" rx="3" fill="#1c3a26" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="160" cy="270" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="185" cy="270" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="255" cy="270" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="280" cy="270" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="340" cy="255" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="365" cy="255" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="435" cy="255" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
    <circle cx="460" cy="255" r="7" fill="#0c1f14" stroke="#4fae3b" stroke-width="1"/>
  </g>
  <text x="30" y="335" font-family="Manrope, sans-serif" font-size="12" letter-spacing="2" fill="#8fd97e" font-weight="700">HALL 05</text>
  <text x="30" y="360" font-family="Anton, sans-serif" font-size="24" fill="#ffffff">THE HEAVEN GARDEN</text>
</svg>
