<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" width="900" height="375">
  <defs>
    <linearGradient id="bounceBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0716"/>
    </linearGradient>
    <radialGradient id="bounceGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4fae3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fae3b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="375" fill="url(#bounceBg)"/>
  <rect width="900" height="375" fill="url(#bounceGlow)"/>
  <!-- trampoline grid floor, angled -->
  <g stroke="#4fae3b" stroke-width="1.2" opacity="0.55">
    <line x1="0" y1="330" x2="900" y2="330"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="60" y1="260" x2="90" y2="330"/>
    <line x1="160" y1="260" x2="230" y2="330"/>
    <line x1="260" y1="260" x2="370" y2="330"/>
    <line x1="360" y1="260" x2="510" y2="330"/>
    <line x1="460" y1="260" x2="650" y2="330"/>
    <line x1="560" y1="260" x2="790" y2="330"/>
    <line x1="660" y1="260" x2="900" y2="330"/>
  </g>
  <rect x="0" y="330" width="900" height="45" fill="#080513"/>
  <!-- padded frame border rectangle -->
  <rect x="30" y="255" width="840" height="8" rx="4" fill="#e8483f" opacity="0.85"/>
  <!-- flying dots (people mid-jump, abstracted) -->
  <g>
    <circle cx="170" cy="120" r="16" fill="#f5a623"/>
    <rect x="158" y="132" width="24" height="34" rx="10" fill="#f5a623"/>
    <circle cx="430" cy="70" r="18" fill="#4fae3b"/>
    <rect x="415" y="84" width="30" height="42" rx="12" fill="#4fae3b"/>
    <circle cx="660" cy="140" r="15" fill="#2e9fd6"/>
    <rect x="649" y="151" width="22" height="32" rx="9" fill="#2e9fd6"/>
  </g>
  <!-- motion arcs -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 6">
    <path d="M120,255 Q170,90 220,255"/>
    <path d="M380,255 Q430,40 480,255"/>
    <path d="M610,255 Q660,110 710,255"/>
  </g>
  <!-- climbing-wall style back wall panels for context -->
  <g opacity="0.5" fill="#241356">
    <circle cx="60" cy="60" r="10"/><circle cx="120" cy="45" r="8"/><circle cx="800" cy="55" r="9"/>
    <circle cx="850" cy="90" r="7"/><circle cx="30" cy="150" r="7"/>
  </g>
  <text x="40" y="40" font-family="Manrope, sans-serif" font-size="13" letter-spacing="2" fill="#8fe07e" font-weight="700">TRAMPOLINE &amp; BOUNCE ARENA</text>
  <text x="40" y="70" font-family="Anton, sans-serif" font-size="34" fill="#ffffff">JUST BOUNCE</text>
</svg>
